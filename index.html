<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Duo Training — Corentin & Lisa</title>
<style>
  :root{
    --bg:#121214;
    --card:#1e1e24;
    --border:#2e2e38;
    --corentin:#3b82f6;
    --lisa:#ec4899;
    --done:#10b981;
    --text:#f2f2f5;
    --text-dim:#9a9aa5;
    --accent: var(--corentin);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-overflow-scrolling: touch;
  }
  body{
    display:flex; flex-direction:column; min-height:100vh;
    padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  }

  /* VUES (écrans) */
  .view{
    display:none; flex-direction:column; flex:1;
  }
  .view.active{ display:flex; }
  .view-inner{
    padding:20px 18px; display:flex; flex-direction:column; gap:12px; flex:1;
  }
  .center-view{ justify-content:center; }
  .app-title{
    font-size:13px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--text-dim); margin:0 0 4px 2px; font-weight:600;
  }
  .big-question{
    font-size:23px; font-weight:800; margin:4px 2px 14px 2px;
  }
  .back-btn{
    align-self:flex-start; background:none; border:none; color:var(--text-dim);
    font-size:14px; font-weight:600; padding:8px 2px; margin-bottom:2px;
  }

  .big-choice-btn{
    padding:24px 18px; border-radius:18px; border:2px solid var(--border);
    background:var(--card); color:var(--text); font-size:19px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-bottom:14px;
    transition: all .15s ease;
  }
  .big-choice-btn.corentin.selected, .big-choice-btn.corentin:active{
    border-color:var(--corentin); color:var(--corentin); background:rgba(59,130,246,0.12);
  }
  .big-choice-btn.lisa.selected, .big-choice-btn.lisa:active{
    border-color:var(--lisa); color:var(--lisa); background:rgba(236,72,153,0.12);
  }

  .session-list{
    display:flex; flex-direction:column; gap:12px;
  }
  .session-btn{
    padding:18px; border-radius:16px; border:1px solid var(--border);
    background:var(--card); color:var(--text); text-align:left;
    display:flex; flex-direction:column; gap:4px; font-family:inherit;
  }
  .session-btn .s-label{font-size:16.5px; font-weight:800;}
  .session-btn .s-subtitle{font-size:13px; color:var(--text-dim); font-weight:500;}
  .session-btn.selected{
    border-color:var(--accent);
  }

  /* HEADER ÉCRAN EXERCICES */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:14px 14px 8px 14px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  header .back-btn.small{
    margin:0; padding:6px 0; flex:0 0 auto;
  }
  header .app-title{ margin:0; }

  /* MAIN */
  main{
    flex:1; padding:14px; display:flex; flex-direction:column; gap:14px;
  }
  .session-title{
    font-size:20px; font-weight:800; margin:4px 2px 0 2px;
  }
  .session-subtitle{
    font-size:13px; color:var(--text-dim); margin:0 2px 4px 2px;
  }

  .exercise-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .exercise-head{display:flex; flex-direction:column; gap:3px;}
  .exercise-name{font-size:16.5px; font-weight:700;}
  .exercise-target{
    font-size:13px; font-weight:600; color:var(--accent);
  }

  .variant-row{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .variant-btn{
    flex:1 1 auto; min-width:0; padding:9px 8px; border-radius:10px;
    border:1px solid var(--border); background:#26262e; color:var(--text-dim);
    font-size:12.5px; font-weight:600; text-align:center; white-space:nowrap;
  }
  .variant-btn.selected{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }

  .set-grid-header, .set-row{
    display:grid; grid-template-columns: 34px 1fr 1fr 44px;
    gap:8px; align-items:center;
  }
  .set-grid-header{
    font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;
    padding:0 2px;
  }
  .set-num{
    font-size:14px; font-weight:700; color:var(--text-dim); text-align:center;
  }
  .set-row input{
    width:100%; padding:10px 8px; border-radius:10px; border:1px solid var(--border);
    background:#26262e; color:var(--text); font-size:16px; text-align:center;
    min-width:0;
  }
  .set-row input:focus{
    outline:none; border-color:var(--accent);
  }
  .check-btn{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--border);
    background:#26262e; color:var(--text-dim); font-size:20px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .check-btn.checked{
    background:var(--done); border-color:var(--done); color:#fff;
  }

  .cardio-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .cardio-card .label{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
  .cardio-card .icon{font-size:22px; flex:0 0 auto;}
  .cardio-text{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .cardio-card .name{font-weight:700; font-size:15px;}
  .cardio-suggestion{font-size:12px; color:var(--text-dim);}
  .cardio-minutes-input{
    width:64px; flex:0 0 auto; padding:10px 6px; border-radius:10px; border:1px solid var(--border);
    background:#26262e; color:var(--text); font-size:16px; text-align:center;
  }
  .cardio-minutes-input:focus{ outline:none; border-color:var(--accent); }

  /* BOTTOM BAR */
  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--card); border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
    display:flex; gap:10px;
  }
  .bottom-btn{
    flex:1; padding:14px 10px; border-radius:14px; border:none;
    font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-reset{
    background:#26262e; color:var(--text); border:1px solid var(--border); flex:0 0 56px;
    font-size:20px;
  }
  .btn-export{
    background:var(--accent); color:#fff;
  }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--card); width:100%; max-width:560px;
    border-radius:20px 20px 0 0; padding:18px; max-height:88vh;
    display:flex; flex-direction:column; gap:12px;
    border-top:1px solid var(--border);
  }
  .modal h3{margin:0; font-size:17px;}
  .modal textarea{
    width:100%; min-height:260px; resize:vertical;
    background:#0f0f12; color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:12px; font-size:13px; line-height:1.5;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    flex:1; padding:13px 10px; border-radius:12px; border:none; font-size:14.5px; font-weight:700;
  }
  .btn-copy{background:var(--done); color:#fff;}
  .btn-close-modal{background:#26262e; color:var(--text); border:1px solid var(--border);}

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#26262e; color:var(--text); padding:10px 18px; border-radius:30px;
    font-size:13.5px; font-weight:600; border:1px solid var(--border);
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:60;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:55;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:20px; width:100%; max-width:340px; text-align:center;
  }
  .confirm-box p{margin:0 0 16px 0; font-size:14.5px; color:var(--text);}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions button{flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px;}
  .btn-cancel{background:#26262e; color:var(--text); border:1px solid var(--border);}
  .btn-confirm{background:#ef4444; color:#fff;}
</style>
</head>
<body>

<!-- ÉCRAN 1 : CHOIX DU PROFIL -->
<div class="view active" id="view-profile">
  <div class="view-inner center-view">
    <p class="app-title">Duo Training</p>
    <h1 class="big-question">Qui s'entraîne ?</h1>
    <button class="big-choice-btn corentin" onclick="selectProfile('corentin')">Corentin</button>
    <button class="big-choice-btn lisa" onclick="selectProfile('lisa')">Lisa</button>
  </div>
</div>

<!-- ÉCRAN 2 : CHOIX DE LA SÉANCE -->
<div class="view" id="view-session">
  <div class="view-inner">
    <button class="back-btn" onclick="goToProfileView()">← Retour</button>
    <h1 class="big-question" id="session-view-title">Choisis ta séance</h1>
    <div class="session-list" id="session-list"></div>
  </div>
</div>

<!-- ÉCRAN 3 : EXERCICES -->
<div class="view" id="view-exercises">
  <header>
    <button class="back-btn small" onclick="goToSessionView()">← Séances</button>
    <p class="app-title" id="exercises-profile-label"></p>
  </header>

  <main id="main-content"></main>

  <div class="bottom-bar" id="bottom-bar">
    <button class="bottom-btn btn-reset" onclick="askReset()">🔄</button>
    <button class="bottom-btn btn-export" onclick="openExportModal()">Terminer &amp; Exporter 📤</button>
  </div>
</div>

<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <h3>📤 Récapitulatif de séance</h3>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-copy" onclick="copyExport()">Copier 📋</button>
      <button class="btn-close-modal" onclick="closeExportModal()">Fermer</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirm-modal">
  <div class="confirm-box">
    <p>Réinitialiser les données de cette séance pour ce profil ?</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">Annuler</button>
      <button class="btn-confirm" onclick="doReset()">Réinitialiser</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- STOCKAGE ROBUSTE (LocalStorage + fallback mémoire) ---------- */
const memoryStore = {};
const storage = {
  get(key){
    try{
      const v = localStorage.getItem(key);
      return v !== null ? v : (key in memoryStore ? memoryStore[key] : null);
    }catch(e){
      return key in memoryStore ? memoryStore[key] : null;
    }
  },
  set(key, value){
    memoryStore[key] = value;
    try{
      localStorage.setItem(key, value);
    }catch(e){ /* fallback mémoire silencieux */ }
  }
};

/* ---------- DONNEES DU PROGRAMME ---------- */
/* Options de variante proposées pour les exercices du haut du corps (haltères / poulie) */
const UPPER_BODY_OPTIONS = ["Haltères", "Poulie unilatéral", "Poulie 2 mains"];

/* Séances numérotées (indépendantes du jour de la semaine, pour s'adapter à un emploi du temps mobile) */
const SESSIONS = [
  {
    id: "s1",
    label: "Séance 1",
    title: "Bas du Corps (Quads & Fessiers)",
    cardio: { name: "Tapis incliné Zone 2", targetMinutes: 30 },
    exercises: [
      { name:"Squat (Barre au rack)", sets:4, target:{corentin:"8-10 reps (Lourd)", lisa:"10-12 reps (Contrôlé)"} },
      { name:"Fentes arrière à la barre (Au rack)", sets:3, target:{corentin:"10 reps/jambe", lisa:"12 reps/jambe"} },
      { name:"Leg Extension (Machine)", sets:3, target:{corentin:"10-12 reps", lisa:"12-15 reps"} },
      { name:"Leg Curl (Machine)", sets:3, target:{corentin:"10-12 reps", lisa:"12-15 reps"} }
    ]
  },
  {
    id: "s2",
    label: "Séance 2",
    title: "Haut du Corps & Abdos",
    cardio: { name: "Tapis incliné Zone 2", targetMinutes: 30 },
    exercises: [
      { name:"Tirage poitrine vertical (Lat Pulldown)", sets:4, target:{corentin:"8-10 reps", lisa:"10-12 reps"}, equipmentOptions: UPPER_BODY_OPTIONS },
      { name:"Développé couché / incliné (Haltères)", sets:4, target:{corentin:"8-10 reps", lisa:"10-12 reps"}, equipmentOptions: UPPER_BODY_OPTIONS },
      { name:"Élévations latérales (Haltères)", sets:4, target:{corentin:"12-15 reps", lisa:"12-15 reps"}, equipmentOptions: UPPER_BODY_OPTIONS },
      { name:"Circuit Abdos (Relevés de jambes 12-15r + Gainage 45s)", sets:3, target:{corentin:"3 tours", lisa:"3 tours"} }
    ]
  },
  {
    id: "s3",
    label: "Séance 3",
    title: "Bas du Corps (Fessiers & Ischios)",
    cardio: { name: "Tapis incliné Zone 2", targetMinutes: 30 },
    exercises: [
      { name:"Hip Thrust (Barre ou machine)", sets:4, target:{corentin:"8-10 reps (Lourd)", lisa:"10-12 reps (Pause 1-2s haut)"} },
      { name:"Soulevé de terre jambes tendues / RDL", sets:4, target:{corentin:"8-10 reps", lisa:"10-12 reps"} },
      { name:"Presse à cuisses (Pieds hauts & écartés)", sets:3, target:{corentin:"10-12 reps", lisa:"12-15 reps"} },
      { name:"Abducteurs à la machine", sets:3, target:{corentin:"15 reps", lisa:"15-20 reps (Pause 1s)"} }
    ]
  },
  {
    id: "s4",
    label: "Séance 4",
    title: "Haut du Corps & Abdos",
    cardio: null,
    exercises: [
      { name:"Rowing poulie basse (Tirage horizontal)", sets:4, target:{corentin:"8-10 reps", lisa:"10-12 reps"}, equipmentOptions: UPPER_BODY_OPTIONS },
      { name:"Développé militaire assis (Haltères)", sets:4, target:{corentin:"8-10 reps", lisa:"10-12 reps"}, equipmentOptions: UPPER_BODY_OPTIONS },
      { name:"Face Pulls (Poulie haute avec corde)", sets:3, target:{corentin:"12-15 reps", lisa:"12-15 reps"}, equipmentOptions: UPPER_BODY_OPTIONS },
      { name:"Circuit Abdos (Crunchs 15-20r + Portefeuille 12-15r)", sets:3, target:{corentin:"3 tours", lisa:"3 tours"} }
    ]
  }
];

function getSession(id){
  return SESSIONS.find(s => s.id === id) || SESSIONS[0];
}

/* ---------- ETAT ---------- */
let currentProfile = storage.get("duo_profile") || "corentin";
let currentSessionId = storage.get("duo_session") || SESSIONS[0].id;
if(!SESSIONS.some(s => s.id === currentSessionId)) currentSessionId = SESSIONS[0].id;

function dataKey(sessionId, profile){
  return `duo_data_${sessionId}_${profile}`;
}
function loadDayData(sessionId, profile){
  const raw = storage.get(dataKey(sessionId, profile));
  if(!raw) return { sets:{}, variants:{}, cardioDone:false, cardioMinutes:'' };
  try{ return JSON.parse(raw); }catch(e){ return { sets:{}, variants:{}, cardioDone:false, cardioMinutes:'' }; }
}
function saveDayData(day, profile, data){
  storage.set(dataKey(day, profile), JSON.stringify(data));
}

/* ---------- RENDU ---------- */
function applyThemeColor(){
  document.documentElement.style.setProperty('--accent', currentProfile === 'lisa' ? 'var(--lisa)' : 'var(--corentin)');
}

function setProfile(profile){
  currentProfile = profile;
  storage.set("duo_profile", profile);
}

function selectProfile(profile){
  setProfile(profile);
  applyThemeColor();
  renderSessionList();
  showView('view-session');
}

function setSession(sessionId){
  currentSessionId = sessionId;
  storage.set("duo_session", sessionId);
}

function selectSession(sessionId){
  setSession(sessionId);
  const profileLabel = document.getElementById('exercises-profile-label');
  profileLabel.textContent = (currentProfile === 'corentin' ? 'Corentin' : 'Lisa');
  showView('view-exercises');
  render();
  adjustBottomSpacing();
  setTimeout(adjustBottomSpacing, 300);
}

function goToProfileView(){
  showView('view-profile');
}

function goToSessionView(){
  renderSessionList();
  showView('view-session');
}

function showView(viewId){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById(viewId);
  if(target) target.classList.add('active');
  window.scrollTo(0,0);
}

function renderSessionList(){
  const title = document.getElementById('session-view-title');
  title.textContent = `Choisis ta séance — ${currentProfile === 'corentin' ? 'Corentin' : 'Lisa'}`;

  const list = document.getElementById('session-list');
  list.innerHTML = '';
  SESSIONS.forEach(session => {
    const btn = document.createElement('button');
    btn.className = 'session-btn' + (session.id === currentSessionId ? ' selected' : '');
    btn.innerHTML = `
      <span class="s-label">${session.label}</span>
      <span class="s-subtitle">${session.title}</span>
    `;
    btn.onclick = () => selectSession(session.id);
    list.appendChild(btn);
  });
}

function render(){
  applyThemeColor();

  const main = document.getElementById('main-content');
  main.innerHTML = '';
  const dayProgram = getSession(currentSessionId);

  const data = loadDayData(currentSessionId, currentProfile);

  const titleEl = document.createElement('div');
  titleEl.className = 'session-title';
  titleEl.textContent = `${dayProgram.label} — ${dayProgram.title}`;
  main.appendChild(titleEl);

  const subtitleEl = document.createElement('div');
  subtitleEl.className = 'session-subtitle';
  subtitleEl.textContent = currentProfile === 'corentin' ? 'Profil : Corentin' : 'Profil : Lisa';
  main.appendChild(subtitleEl);

  data.variants = data.variants || {};

  dayProgram.exercises.forEach((ex, exIdx) => {
    const card = document.createElement('div');
    card.className = 'exercise-card';

    const head = document.createElement('div');
    head.className = 'exercise-head';
    head.innerHTML = `
      <div class="exercise-name">${ex.name}</div>
      <div class="exercise-target">${ex.target[currentProfile]}</div>
    `;
    card.appendChild(head);

    if(ex.equipmentOptions){
      const variantRow = document.createElement('div');
      variantRow.className = 'variant-row';
      const selectedVariant = data.variants[exIdx] || '';

      ex.equipmentOptions.forEach(option => {
        const optBtn = document.createElement('button');
        optBtn.className = 'variant-btn' + (selectedVariant === option ? ' selected' : '');
        optBtn.textContent = option;
        optBtn.onclick = () => {
          const d = loadDayData(currentSessionId, currentProfile);
          d.variants = d.variants || {};
          d.variants[exIdx] = (d.variants[exIdx] === option) ? '' : option;
          saveDayData(currentSessionId, currentProfile, d);
          render();
        };
        variantRow.appendChild(optBtn);
      });
      card.appendChild(variantRow);
    }

    const gridHeader = document.createElement('div');
    gridHeader.className = 'set-grid-header';
    gridHeader.innerHTML = `<span>#</span><span>Poids (kg)</span><span>Reps</span><span>✓</span>`;
    card.appendChild(gridHeader);

    for(let s = 1; s <= ex.sets; s++){
      const setKey = `ex${exIdx}_set${s}`;
      const savedSet = data.sets[setKey] || { weight:'', reps:'', done:false };

      const row = document.createElement('div');
      row.className = 'set-row';

      const num = document.createElement('div');
      num.className = 'set-num';
      num.textContent = s;
      row.appendChild(num);

      const weightInput = document.createElement('input');
      weightInput.type = 'number';
      weightInput.inputMode = 'decimal';
      weightInput.placeholder = 'kg';
      weightInput.value = savedSet.weight;
      weightInput.oninput = () => {
        const d = loadDayData(currentSessionId, currentProfile);
        d.sets[setKey] = d.sets[setKey] || { weight:'', reps:'', done:false };
        d.sets[setKey].weight = weightInput.value;
        saveDayData(currentSessionId, currentProfile, d);
      };
      row.appendChild(weightInput);

      const repsInput = document.createElement('input');
      repsInput.type = 'number';
      repsInput.inputMode = 'numeric';
      repsInput.placeholder = 'reps';
      repsInput.value = savedSet.reps;
      repsInput.oninput = () => {
        const d = loadDayData(currentSessionId, currentProfile);
        d.sets[setKey] = d.sets[setKey] || { weight:'', reps:'', done:false };
        d.sets[setKey].reps = repsInput.value;
        saveDayData(currentSessionId, currentProfile, d);
      };
      row.appendChild(repsInput);

      const checkBtn = document.createElement('button');
      checkBtn.className = 'check-btn' + (savedSet.done ? ' checked' : '');
      checkBtn.textContent = '✓';
      checkBtn.onclick = () => {
        const d = loadDayData(currentSessionId, currentProfile);
        d.sets[setKey] = d.sets[setKey] || { weight:'', reps:'', done:false };
        d.sets[setKey].done = !d.sets[setKey].done;
        saveDayData(currentSessionId, currentProfile, d);
        checkBtn.classList.toggle('checked', d.sets[setKey].done);
      };
      row.appendChild(checkBtn);

      card.appendChild(row);
    }

    main.appendChild(card);
  });

  if(dayProgram.cardio){
    const cardioCard = document.createElement('div');
    cardioCard.className = 'cardio-card';
    cardioCard.innerHTML = `
      <div class="label">
        <span class="icon">🏃</span>
        <div class="cardio-text">
          <span class="name">${dayProgram.cardio.name}</span>
          <span class="cardio-suggestion">Suggestion : ${dayProgram.cardio.targetMinutes} min</span>
        </div>
      </div>
    `;

    const minutesInput = document.createElement('input');
    minutesInput.type = 'number';
    minutesInput.inputMode = 'numeric';
    minutesInput.className = 'cardio-minutes-input';
    minutesInput.placeholder = 'min';
    minutesInput.value = data.cardioMinutes || '';
    minutesInput.oninput = () => {
      const d = loadDayData(currentSessionId, currentProfile);
      d.cardioMinutes = minutesInput.value;
      saveDayData(currentSessionId, currentProfile, d);
    };
    cardioCard.appendChild(minutesInput);

    const cardioBtn = document.createElement('button');
    cardioBtn.className = 'check-btn' + (data.cardioDone ? ' checked' : '');
    cardioBtn.textContent = '✓';
    cardioBtn.onclick = () => {
      const d = loadDayData(currentSessionId, currentProfile);
      d.cardioDone = !d.cardioDone;
      saveDayData(currentSessionId, currentProfile, d);
      cardioBtn.classList.toggle('checked', d.cardioDone);
    };
    cardioCard.appendChild(cardioBtn);
    main.appendChild(cardioCard);
  }
}

/* ---------- RESET ---------- */
function askReset(){
  document.getElementById('confirm-modal').classList.add('open');
}
function closeConfirm(){
  document.getElementById('confirm-modal').classList.remove('open');
}
function doReset(){
  saveDayData(currentSessionId, currentProfile, { sets:{}, variants:{}, cardioDone:false, cardioMinutes:'' });
  closeConfirm();
  render();
  showToast('Séance réinitialisée');
}

/* ---------- EXPORT ---------- */
function buildExportText(){
  const dayProgram = getSession(currentSessionId);
  const profileName = currentProfile === 'corentin' ? 'Corentin' : 'Lisa';
  const today = new Date();
  const dateStr = today.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });

  const data = loadDayData(currentSessionId, currentProfile);
  data.variants = data.variants || {};
  let txt = `🏋️ BILAN DE SÉANCE\n`;
  txt += `Nom : ${profileName}\n`;
  txt += `Date : ${dateStr}\n`;
  txt += `Séance : ${dayProgram.label} — ${dayProgram.title}\n`;
  txt += `------------------------------\n`;

  dayProgram.exercises.forEach((ex, exIdx) => {
    txt += `\n${ex.name}\n`;
    if(ex.equipmentOptions && data.variants[exIdx]){
      txt += `Variante : ${data.variants[exIdx]}\n`;
    }
    txt += `Cible : ${ex.target[currentProfile]}\n`;
    for(let s = 1; s <= ex.sets; s++){
      const setKey = `ex${exIdx}_set${s}`;
      const setData = data.sets[setKey] || { weight:'', reps:'', done:false };
      const weight = setData.weight !== '' ? setData.weight : '-';
      const reps = setData.reps !== '' ? setData.reps : '-';
      const status = setData.done ? '✅' : '❌';
      txt += `  Série ${s} : ${weight} kg x ${reps} reps ${status}\n`;
    }
  });

  if(dayProgram.cardio){
    const minutesStr = data.cardioMinutes ? `${data.cardioMinutes} min` : 'non renseigné';
    txt += `\nCardio : ${dayProgram.cardio.name} — ${minutesStr} ${data.cardioDone ? '✅' : '❌'}\n`;
  }

  return txt;
}

function openExportModal(){
  document.getElementById('export-text').value = buildExportText();
  document.getElementById('export-modal').classList.add('open');
}
function closeExportModal(){
  document.getElementById('export-modal').classList.remove('open');
}
function copyExport(){
  const textarea = document.getElementById('export-text');
  textarea.select();
  textarea.setSelectionRange(0, 999999);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(textarea.value).then(() => {
        showToast('Copié dans le presse-papier ✅');
      }).catch(() => {
        fallbackCopy(textarea);
      });
    } else {
      fallbackCopy(textarea);
    }
  }catch(e){
    fallbackCopy(textarea);
  }
}
function fallbackCopy(textarea){
  try{
    document.execCommand('copy');
    showToast('Copié dans le presse-papier ✅');
  }catch(e){
    showToast('Copie impossible — sélectionne le texte manuellement');
  }
}

/* ---------- TOAST ---------- */
let toastTimer;
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ---------- AJUSTEMENT DYNAMIQUE DE L'ESPACE SOUS LE CONTENU (fix iPhone) ---------- */
function adjustBottomSpacing(){
  try{
    const bar = document.getElementById('bottom-bar');
    if(bar){
      const h = bar.offsetHeight;
      const computed = h + 24;
      // ne jamais descendre sous le minimum de sécurité défini en CSS (120px + safe-area)
      document.body.style.paddingBottom = Math.max(computed, 120) + 'px';
    }
  }catch(e){ /* ignore, le CSS statique sert de filet de sécurité */ }
}
window.addEventListener('resize', adjustBottomSpacing);
window.addEventListener('orientationchange', () => setTimeout(adjustBottomSpacing, 200));
window.addEventListener('load', adjustBottomSpacing);

/* ---------- INIT ---------- */
render();
adjustBottomSpacing();
setTimeout(adjustBottomSpacing, 300); // sécurité si les polices/safe-area se stabilisent après le premier rendu
</script>
