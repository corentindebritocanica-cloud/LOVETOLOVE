<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Duo Training — Corentin & Lisa</title>
<style>
  :root{
    --bg:#0b0b0e;
    --card:#1a1a20;
    --card-2:#242429;
    --border:rgba(255,255,255,0.08);
    --corentin:#4c8dfb;
    --lisa:#f2599e;
    --done:#12b981;
    --text:#f6f6f8;
    --text-dim:#94949e;
    --accent: var(--corentin);
    --shadow: 0 14px 32px rgba(0,0,0,0.42), 0 2px 8px rgba(0,0,0,0.28);
    --shadow-sm: 0 6px 16px rgba(0,0,0,0.28);
    --glass-bar: rgba(24,24,29,0.86);
    --glass-modal: rgba(24,24,29,0.94);
    --reset-btn-bg: rgba(255,255,255,0.07);
  }
  html.light-mode{
    --bg:#f4f4f7;
    --card:#ffffff;
    --card-2:#f0f0f3;
    --border:rgba(15,15,20,0.09);
    --text:#15151a;
    --text-dim:#6c6c76;
    --shadow: 0 14px 28px rgba(20,20,30,0.09), 0 2px 8px rgba(20,20,30,0.05);
    --shadow-sm: 0 6px 14px rgba(20,20,30,0.07);
    --glass-bar: rgba(255,255,255,0.82);
    --glass-modal: rgba(255,255,255,0.94);
    --reset-btn-bg: rgba(15,15,20,0.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-overflow-scrolling: touch;
    transition: background .25s ease, color .25s ease;
  }

  /* bouton bascule de thème */
  .theme-toggle{
    position:fixed; top:14px; right:14px; z-index:25;
    width:38px; height:38px; border-radius:50%;
    background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; box-shadow: var(--shadow-sm);
  }
  .sync-badge{
    position:fixed; top:16px; right:56px; z-index:25;
    font-size:9px; width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--card); box-shadow: var(--shadow-sm);
  }

  body{
    display:flex; flex-direction:column; min-height:100vh;
    padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  }

  /* VUES (écrans) */
  .view{
    display:none; flex-direction:column; flex:1; position:relative; z-index:1;
  }
  .view.active{ display:flex; }
  .view.slide-fwd{ animation: slideInFwd .32s cubic-bezier(.4,0,.2,1); }
  .view.slide-back{ animation: slideInBack .32s cubic-bezier(.4,0,.2,1); }
  @keyframes slideInFwd{ from{ transform:translateX(28px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  @keyframes slideInBack{ from{ transform:translateX(-28px); opacity:0; } to{ transform:translateX(0); opacity:1; } }

  .view-inner{
    padding:22px 18px; display:flex; flex-direction:column; gap:14px; flex:1;
  }
  .center-view{ justify-content:center; }
  .app-title{
    font-size:12.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--text-dim); margin:0 0 4px 2px; font-weight:700;
  }
  .big-question{
    font-size:25px; font-weight:850; letter-spacing:-0.02em; margin:4px 2px 16px 2px;
  }
  .back-btn{
    align-self:flex-start; background:none; border:none; color:var(--text-dim);
    font-size:14px; font-weight:600; padding:8px 2px; margin-bottom:2px;
  }

  .big-choice-btn{
    padding:26px 20px; border-radius:20px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:19px; font-weight:800;
    display:flex; align-items:center; justify-content:flex-start; gap:16px; margin-bottom:14px;
    box-shadow: var(--shadow-sm);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  .big-choice-btn:active{ transform: scale(0.98); }
  .big-choice-btn .choice-icon{
    width:46px; height:46px; flex:0 0 auto; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.05);
  }
  .big-choice-btn.corentin.selected{
    border-color:var(--corentin); color:var(--corentin); background:rgba(76,141,251,0.1);
    box-shadow: 0 10px 28px rgba(76,141,251,0.18), var(--shadow-sm);
  }
  .big-choice-btn.corentin.selected .choice-icon{ background:rgba(76,141,251,0.18); }
  .big-choice-btn.lisa.selected{
    border-color:var(--lisa); color:var(--lisa); background:rgba(242,89,158,0.1);
    box-shadow: 0 10px 28px rgba(242,89,158,0.18), var(--shadow-sm);
  }
  .big-choice-btn.lisa.selected .choice-icon{ background:rgba(242,89,158,0.18); }
  .big-choice-btn.build{
    border-style:dashed; font-size:16px; opacity:0.9;
  }
  .big-choice-btn.build:active{
    border-color:var(--text-dim); color:var(--text); background:var(--card-2);
  }

  .session-list{
    display:flex; flex-direction:column; gap:14px;
  }
  .session-btn{
    padding:18px; border-radius:18px; border:1px solid var(--border);
    background:var(--card); color:var(--text); text-align:left;
    display:flex; align-items:center; gap:14px; font-family:inherit;
    box-shadow: var(--shadow-sm);
    transition: transform .15s ease, border-color .15s ease;
  }
  .session-btn:active{ transform: scale(0.98); }
  .session-btn .session-icon{
    width:44px; height:44px; flex:0 0 auto; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.05); color: var(--accent);
  }
  .session-btn .session-text{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .session-btn .s-label{font-size:16.5px; font-weight:800;}
  .session-btn .s-subtitle{font-size:13px; color:var(--text-dim); font-weight:500;}
  .session-btn.selected{
    border-color:var(--accent);
  }
  .session-btn.selected .session-icon{ background:rgba(255,255,255,0.1); }
  .custom-session-row{ cursor:pointer; }
  .custom-session-delete{
    flex:0 0 auto; width:34px; height:34px; border-radius:10px;
    border:1px solid var(--border); background:var(--card-2); color:var(--text-dim);
    font-size:13px; display:flex; align-items:center; justify-content:center;
  }

  /* HEADER ÉCRAN EXERCICES */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:14px 14px 10px 14px;
    border-bottom:1px solid var(--border);
    display:flex; flex-direction:column; gap:8px;
  }
  .header-row{ display:flex; align-items:center; gap:10px; }
  header .back-btn.small{
    margin:0; padding:6px 0; flex:0 0 auto;
  }
  header .app-title{ margin:0; flex:1; }
  .undo-btn{
    flex:0 0 auto; background:none; border:none; font-size:17px; padding:6px 4px;
    opacity:0.85;
  }
  .session-progress-track{
    height:5px; border-radius:4px; background:var(--card-2); overflow:hidden;
  }
  .session-progress-fill{
    height:100%; width:0%; background:var(--accent); border-radius:4px;
    transition: width .3s cubic-bezier(.4,0,.2,1);
  }
  .session-progress-label{
    font-size:11.5px; color:var(--text-dim); font-weight:600; margin:0;
  }
  .session-tonnage-label{
    font-size:11px; color:var(--text-dim); font-weight:500; margin:0; opacity:0.8;
  }

  /* MAIN */
  main{
    flex:1; padding:16px; display:flex; flex-direction:column; gap:16px;
  }
  .session-title{
    font-size:21px; font-weight:850; letter-spacing:-0.02em; margin:4px 2px 0 2px;
  }
  .session-subtitle{
    font-size:13px; color:var(--text-dim); margin:0 2px 4px 2px;
  }

  .exercise-card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:17px; display:flex; flex-direction:column; gap:11px;
    box-shadow: var(--shadow-sm);
  }
  .exercise-head{display:flex; flex-direction:column; gap:3px;}
  .exercise-name{font-size:16.5px; font-weight:750;}
  .exercise-target{
    font-size:13px; font-weight:600; color:var(--accent);
  }

  .variant-row{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .variant-btn{
    flex:1 1 auto; min-width:0; padding:9px 8px; border-radius:10px;
    border:1px solid var(--border); background:transparent; color:var(--text-dim);
    font-size:12.5px; font-weight:600; text-align:center; white-space:nowrap;
    transition: border-color .15s ease, color .15s ease;
  }
  .variant-btn.selected{
    border-color:var(--accent); color:var(--accent); background:rgba(255,255,255,0.03);
  }

  .set-grid-header, .set-row{
    display:grid; grid-template-columns: 30px 1fr 1fr 26px 44px;
    gap:8px; align-items:center;
  }
  .set-grid-header.circuit, .set-row.circuit{
    grid-template-columns: 1fr 44px;
  }
  .set-row.circuit .set-num{
    text-align:left; font-size:15px;
  }
  .set-grid-header{
    font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;
    padding:0 2px;
  }
  .set-num{
    font-size:14px; font-weight:700; color:var(--text-dim); text-align:center;
  }
  .set-row input{
    width:100%; padding:10px 8px; border-radius:10px; border:1px solid var(--border);
    background:var(--card-2); color:var(--text); font-size:16px; text-align:center;
    min-width:0;
  }
  .set-row input:focus{
    outline:none; border-color:var(--accent);
  }
  .dup-btn{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--border);
    background:transparent; color:var(--text-dim); font-size:13px;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .dup-btn:active{ color:var(--accent); border-color:var(--accent); }

  .note-wrap{
    display:flex; flex-direction:column; gap:5px; margin-top:2px;
    padding-top:10px; border-top:1px solid var(--border);
  }
  .note-label{
    font-size:11px; color:var(--text-dim); font-weight:700; letter-spacing:0.2px;
  }
  .note-input{
    width:100%; min-height:36px; padding:9px 10px; border-radius:10px;
    border:1px solid var(--border); background:var(--card-2); color:var(--text);
    font-size:13px; font-family:inherit; resize:vertical; line-height:1.35;
  }
  .note-input:focus{ outline:none; border-color:var(--accent); }
  .note-input::placeholder{ color:var(--text-dim); opacity:0.75; }

  .check-btn{
    width:44px; height:44px; border-radius:12px; border:1px solid var(--border);
    background:var(--card-2); color:var(--text-dim); font-size:20px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .check-btn.checked{
    background:var(--done); border-color:var(--done); color:#fff;
  }
  .check-btn.pulse{
    animation: checkPulse .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes checkPulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }

  .cardio-card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:17px; display:flex; flex-direction:column; gap:14px;
    box-shadow: var(--shadow-sm);
  }
  .cardio-top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cardio-card .label{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
  .cardio-card .icon{font-size:22px; flex:0 0 auto;}
  .cardio-text{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .cardio-card .name{font-weight:700; font-size:15px;}
  .cardio-suggestion{font-size:12px; color:var(--text-dim);}
  .cardio-fields-row{ display:flex; gap:10px; }
  .cardio-field{ flex:1; display:flex; flex-direction:column; gap:5px; }
  .cardio-field-label{ font-size:11px; color:var(--text-dim); font-weight:600; }
  .cardio-minutes-input{
    width:100%; padding:10px 6px; border-radius:10px; border:1px solid var(--border);
    background:var(--card-2); color:var(--text); font-size:16px; text-align:center;
  }
  .cardio-minutes-input:focus{ outline:none; border-color:var(--accent); }

  /* BOTTOM BAR */
  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--glass-bar);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
    display:flex; gap:10px;
  }
  .bottom-btn{
    flex:1; padding:14px 10px; border-radius:16px; border:1px solid transparent;
    font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .15s ease;
  }
  .bottom-btn:active{ transform:scale(0.97); }
  .btn-reset{
    background:var(--reset-btn-bg); color:var(--text); border-color:var(--border); flex:0 0 56px;
    font-size:20px;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .btn-export{
    background:rgba(var(--accent-rgb, 76,141,251), 0.28); color:#fff; border-color:rgba(255,255,255,0.12);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--glass-modal);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
    width:100%; max-width:560px;
    border-radius:22px 22px 0 0; padding:18px; max-height:88vh;
    display:flex; flex-direction:column; gap:12px;
    border-top:1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .modal h3{margin:0; font-size:17px;}
  .motivation-line{
    margin:0; font-size:13.5px; font-weight:700; color:var(--accent);
  }
  .modal textarea{
    width:100%; min-height:260px; resize:vertical;
    background:var(--card-2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:12px; font-size:13px; line-height:1.5;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    flex:1; padding:13px 10px; border-radius:12px; border:none; font-size:14.5px; font-weight:700;
  }
  .btn-copy{background:var(--done); color:#fff;}
  .btn-close-modal{background:var(--card-2); color:var(--text); border:1px solid var(--border);}

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--card-2); color:var(--text); padding:10px 18px; border-radius:30px;
    font-size:13.5px; font-weight:600; border:1px solid var(--border);
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:60;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:55;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:20px; width:100%; max-width:340px; text-align:center;
  }
  .confirm-box p{margin:0 0 16px 0; font-size:14.5px; color:var(--text);}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions button{flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px;}
  .btn-cancel{background:var(--card-2); color:var(--text); border:1px solid var(--border);}
  .btn-confirm{background:#ef4444; color:#fff;}

  /* POPUP FIN DE SÉANCE */
  .finish-box{ max-width:360px; padding:22px 20px; }
  .finish-title{ font-size:18px; font-weight:800; margin:0 0 4px 0 !important; }
  .finish-sub{ font-size:13px; color:var(--text-dim); margin:0 0 16px 0 !important; }
  .finish-actions{ display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .finish-btn{
    padding:15px 12px; border-radius:14px; border:1px solid var(--border);
    font-size:15px; font-weight:700; text-align:center;
  }
  .finish-btn.copy{ background:var(--card-2); color:var(--text); }
  .finish-btn.archive{ background:var(--accent); color:#fff; border-color:transparent; }
  .btn-cancel-text{
    background:none; border:none; color:var(--text-dim); font-size:13.5px;
    font-weight:600; padding:6px; width:100%;
  }

  /* BUILD TRAINING */
  .builder-field{ display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .builder-label{ font-size:12.5px; color:var(--text-dim); font-weight:700; }
  .builder-input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card-2); color:var(--text); font-size:15px; font-family:inherit;
  }
  .builder-input:focus{ outline:none; border-color:var(--accent); }
  .builder-toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; margin-top:6px;
  }
  .builder-checkbox{ width:20px; height:20px; accent-color:var(--accent); flex:0 0 auto; }
  .builder-exercises{ display:flex; flex-direction:column; gap:12px; margin-top:14px; }
  .builder-exercise-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:14px; display:flex; flex-direction:column; gap:10px;
    box-shadow: var(--shadow-sm);
  }
  .builder-exercise-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .builder-exercise-num{ font-size:12px; color:var(--text-dim); font-weight:700; }
  .builder-head-actions{ display:flex; gap:6px; }
  .builder-move-btn, .builder-remove-btn{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--border);
    background:transparent; color:var(--text-dim); font-size:12px;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .builder-move-btn:disabled{ opacity:0.3; }
  .builder-exercise-row{ display:flex; flex-direction:column; gap:5px; }
  .builder-exercise-row .mini-label{ font-size:11px; color:var(--text-dim); font-weight:600; }
  .builder-exercise-row input{
    width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--border);
    background:var(--card-2); color:var(--text); font-size:14px; font-family:inherit;
  }
  .builder-exercise-row input:focus{ outline:none; border-color:var(--accent); }
  .builder-reps-row{ display:flex; gap:10px; }
  .builder-reps-row .builder-exercise-row{ flex:1; }
  .builder-options-row{ display:flex; flex-direction:column; gap:8px; margin-top:2px; }
  .builder-checkbox-label{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); font-weight:600;
  }
  .builder-checkbox-label input{ width:17px; height:17px; accent-color:var(--accent); flex:0 0 auto; }
  .builder-add-btn{
    padding:13px; border-radius:12px; border:1px dashed var(--border);
    background:transparent; color:var(--text-dim); font-size:14px; font-weight:700;
    margin-top:14px;
  }
  .builder-save-btn{
    padding:15px; border-radius:14px; border:none; margin-top:20px;
    background:var(--accent); color:#fff; font-size:15.5px; font-weight:800;
  }

  /* ARCHIVES */
  .archive-toolbar{ display:flex; gap:10px; margin:2px 0 4px 0; }
  .archive-tool-btn{
    flex:1; padding:11px 8px; border-radius:12px; border:1px solid var(--border);
    background:var(--card-2); color:var(--text); font-size:13px; font-weight:700;
  }
  .archive-list{ display:flex; flex-direction:column; gap:12px; }

  .progress-exercise-list{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .progress-exercise-btn{
    padding:14px 16px; border-radius:14px; border:1px solid var(--border);
    background:var(--card); color:var(--text); text-align:left;
    font-size:14.5px; font-weight:700; box-shadow: var(--shadow-sm);
  }
  .progress-exercise-btn.selected{ border-color:var(--accent); color:var(--accent); }
  .progress-chart-card{
    margin-top:16px; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:16px; box-shadow: var(--shadow-sm);
  }
  .progress-chart-title{ font-size:14px; font-weight:800; margin-bottom:10px; }
  .progress-chart-empty{ color:var(--text-dim); font-size:13px; text-align:center; padding:20px 0; }
  .progress-point-label{ font-size:9.5px; fill:var(--text-dim); }

  // ---------- FIREBASE (archives partagées Corentin / Lisa, temps réel) ----------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot,
    enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDk07pFMBaSwV7HCmqZGw4hq-OJcu4UUbY",
    authDomain: "duo-training-e835b.firebaseapp.com",
    projectId: "duo-training-e835b",
    storageBucket: "duo-training-e835b.firebasestorage.app",
    messagingSenderId: "543084754030",
    appId: "1:543084754030:web:7ea0c673faf74648f7227f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Persistance hors-ligne : les lectures/écritures faites sans réseau sont mises
  // en cache local puis synchronisées automatiquement dès que la connexion revient.
  enableIndexedDbPersistence(db).catch((err) => {
    console.warn('Persistance hors-ligne indisponible :', err.code);
  });

  const archivesCol = collection(db, 'archives');
  const customSessionsCol = collection(db, 'customSessions');

  // Pont vers le script principal (non-module)
  window.__fb = { db, doc, setDoc, deleteDoc };

  function updateSyncStatus(hasPendingWrites, fromCache){
    window.__syncPending = hasPendingWrites;
    window.__syncFromCache = fromCache;
    window.dispatchEvent(new Event('sync-status-updated'));
  }

  onSnapshot(archivesCol, { includeMetadataChanges: true }, (snapshot) => {
    const all = [];
    snapshot.forEach(d => all.push(d.data()));
    all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    window.archivesCache = {
      corentin: all.filter(a => a.profile === 'corentin'),
      lisa: all.filter(a => a.profile === 'lisa')
    };
    updateSyncStatus(snapshot.metadata.hasPendingWrites, snapshot.metadata.fromCache);
    window.dispatchEvent(new Event('archives-updated'));
  }, (error) => {
    console.error('Erreur de synchronisation Firestore', error);
  });

  onSnapshot(customSessionsCol, { includeMetadataChanges: true }, (snapshot) => {
    const all = [];
    snapshot.forEach(d => all.push(d.data()));
    all.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    window.customSessionsCache = all;
    updateSyncStatus(snapshot.metadata.hasPendingWrites, snapshot.metadata.fromCache);
    window.dispatchEvent(new Event('custom-sessions-updated'));
  }, (error) => {
    console.error('Erreur de synchronisation Firestore (customSessions)', error);
  });
</script>

<script>
/* ---------- STOCKAGE ROBUSTE (LocalStorage + fallback mémoire) ---------- */
const memoryStore = {};
const storage = {
  get(key){
    try{
      const v = localStorage.getItem(key);
      return v !== null ? v : (key in memoryStore ? memoryStore[key] : null);
    }catch(e){
      return key in memoryStore ? memoryStore[key] : null;
    }
  },
  set(key, value){
    memoryStore[key] = value;
    try{
      localStorage.setItem(key, value);
    }catch(e){ /* fallback mémoire silencieux */ }
  }
};

/* ---------- BADGE DE SYNCHRONISATION ---------- */
function updateSyncBadge(){
  const badge = document.getElementById('sync-badge');
  if(!badge) return;
  if(!navigator.onLine){
    badge.textContent = '🔴';
    badge.title = 'Hors ligne — sera synchronisé au retour du réseau';
  } else if(window.__syncPending){
    badge.textContent = '🟡';
    badge.title = 'Synchronisation en cours...';
  } else {
    badge.textContent = '🟢';
    badge.title = 'Synchronisé';
  }
}
window.addEventListener('sync-status-updated', updateSyncBadge);
window.addEventListener('online', updateSyncBadge);
window.addEventListener('offline', updateSyncBadge);
updateSyncBadge();

  const fixed = SESSIONS.find(s => s.id === id);
  if(fixed) return fixed;
  const custom = (window.customSessionsCache || []).find(s => s.id === id);
  if(custom) return custom;

/* ---------- ETAT ---------- */
let currentProfile = storage.get("duo_profile") || "corentin";
let currentSessionId = storage.get("duo_session") || SESSIONS[0].id;
if(!SESSIONS.some(s => s.id === currentSessionId)) currentSessionId = SESSIONS[0].id;

function dataKey(sessionId, profile){
  return `duo_data_${sessionId}_${profile}`;
}
function loadDayData(sessionId, profile){
  const raw = storage.get(dataKey(sessionId, profile));
  if(!raw) return { sets:{}, variants:{}, notes:{}, cardioDone:false, cardioMinutes:'', cardioCalories:'' };
  try{ return JSON.parse(raw); }catch(e){ return { sets:{}, variants:{}, notes:{}, cardioDone:false, cardioMinutes:'', cardioCalories:'' }; }
}
function saveDayData(day, profile, data){
  storage.set(dataKey(day, profile), JSON.stringify(data));
}

/* ---------- ANNULER LA DERNIÈRE ACTION ---------- */
const undoStacks = {}; // { "sessionId_profile": [snapshot1, snapshot2, ...] }
function pushUndoSnapshot(){
  const key = dataKey(currentSessionId, currentProfile);
  if(!undoStacks[key]) undoStacks[key] = [];
  undoStacks[key].push(JSON.stringify(loadDayData(currentSessionId, currentProfile)));
  if(undoStacks[key].length > 25) undoStacks[key].shift();
}
function undoLastAction(){
  const key = dataKey(currentSessionId, currentProfile);
  const stack = undoStacks[key];
  if(!stack || stack.length === 0){
    showToast('Rien à annuler');
    return;
  }
  const previous = stack.pop();
  try{
    storage.set(key, previous);
  }catch(e){ /* ignore */ }
  render();
  showToast('Dernière action annulée ↩️');
}

function renderSessionList(){

    editBtn.onclick = (e) => {

    const delBtn = document.createElement('button');
    delBtn.className = 'custom-session-delete';

function computeSessionTonnage(dayProgram, data){
  let tonnage = 0;
  dayProgram.exercises.forEach((ex, exIdx) => {
    for(let s = 1; s <= ex.sets; s++){
      const setData = data.sets[`ex${exIdx}_set${s}`];
      if(ex.logType !== 'circuit' && setData){
        const w = parseFloat(setData.weight);
        const r = parseFloat(setData.reps);
        if(!isNaN(w) && !isNaN(r)) tonnage += w * r;
      }
    }
  });
  return tonnage;
}

function updateSessionProgress(){
  const dayProgram = getSession(currentSessionId);
  const data = loadDayData(currentSessionId, currentProfile);
  let total = 0, done = 0;
  const tonnage = computeSessionTonnage(dayProgram, data);

  dayProgram.exercises.forEach((ex, exIdx) => {
    for(let s = 1; s <= ex.sets; s++){
      total++;
      const setData = data.sets[`ex${exIdx}_set${s}`];
      if(setData && setData.done) done++;
    }
  });
  if(dayProgram.cardio){
    total++;
    if(data.cardioDone) done++;
  }

  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const fill = document.getElementById('session-progress-fill');
  const label = document.getElementById('session-progress-label');
  const tonnageLabel = document.getElementById('session-tonnage-label');
  if(fill) fill.style.width = pct + '%';
  if(label) label.textContent = `${done} / ${total} validés`;
  if(tonnageLabel){
    const formatted = Math.round(tonnage).toLocaleString('fr-FR');
    tonnageLabel.textContent = tonnage > 0 ? `💪 ${formatted} kg soulevés cette séance` : '';
  }
}

function buildExportText(){
  const dayProgram = getSession(currentSessionId);
  const profileName = currentProfile === 'corentin' ? 'Corentin' : 'Lisa';
  const today = new Date();
  const dateStr = today.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });

  const data = loadDayData(currentSessionId, currentProfile);
  data.variants = data.variants || {};
  data.notes = data.notes || {};
  let txt = `🏋️ BILAN DE SÉANCE\n`;
  txt += `Nom : ${profileName}\n`;
  txt += `Date : ${dateStr}\n`;
  txt += `Séance : ${dayProgram.label} — ${dayProgram.title}\n`;
  txt += `------------------------------\n`;

  dayProgram.exercises.forEach((ex, exIdx) => {
    txt += `\n${ex.name}\n`;
    if(ex.equipmentOptions && data.variants[exIdx]){
      txt += `Variante : ${data.variants[exIdx]}\n`;
    }
    txt += `Cible : ${ex.target[currentProfile]}\n`;
    for(let s = 1; s <= ex.sets; s++){
      const setKey = `ex${exIdx}_set${s}`;
      const setData = data.sets[setKey] || { weight:'', reps:'', done:false };
      const status = setData.done ? '✅' : '❌';
      if(ex.logType === 'circuit'){
        txt += `  Tour ${s} : ${status}\n`;
      } else {
        const weight = setData.weight !== '' ? setData.weight : '-';
        const reps = setData.reps !== '' ? setData.reps : '-';
        txt += `  Série ${s} : ${weight} kg x ${reps} reps ${status}\n`;
      }
    }
    if(data.notes[exIdx] && data.notes[exIdx].trim() !== ''){
      txt += `  🗒️ Info : ${data.notes[exIdx].trim()}\n`;
    }
  });

  if(dayProgram.cardio){
    const minutesStr = data.cardioMinutes !== '' && data.cardioMinutes != null ? `${data.cardioMinutes} min` : 'non renseigné';
    const caloriesStr = data.cardioCalories !== '' && data.cardioCalories != null ? `${data.cardioCalories} kcal` : 'non renseigné';
    txt += `\nCardio : ${dayProgram.cardio.name} — ${minutesStr}, ${caloriesStr} ${data.cardioDone ? '✅' : '❌'}\n`;
  }

  return txt;
}

/* ---------- COPIE PRESSE-PAPIER (partagée) ---------- */
function copyTextToClipboard(text, sourceTextarea){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copié dans le presse-papier ✅');
      }).catch(() => {
        fallbackCopy(text, sourceTextarea);
      });
    } else {
      fallbackCopy(text, sourceTextarea);
    }
  }catch(e){
    fallbackCopy(text, sourceTextarea);
  }
}
function fallbackCopy(text, sourceTextarea){
  try{
    let ta = sourceTextarea;
    let temp = false;
    if(!ta){
      ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      temp = true;
    }
    ta.select();
    ta.setSelectionRange(0, 999999);
    document.execCommand('copy');
    if(temp) document.body.removeChild(ta);
    showToast('Copié dans le presse-papier ✅');
  }catch(e){
    showToast('Copie impossible — sélectionne le texte manuellement');
  }
}

function getBestSetPerArchiveForExercise(profile, exerciseName){
  const archives = getArchivesList(profile).slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const points = [];

  archives.forEach(arc => {
    const names = arc.exerciseNames || [];
    const exIdx = names.indexOf(exerciseName);
    if(exIdx === -1) return;
    const rawSets = arc.rawSets || {};
    let best = 0;
    Object.keys(rawSets).forEach(key => {
      if(key.indexOf(`ex${exIdx}_set`) !== 0) return;
      const w = parseFloat(rawSets[key].weight);
      if(!isNaN(w) && w > best) best = w;
    });
    if(best > 0){
      points.push({ dateLabel: arc.dateLabel, weight: best });
    }
  });

  return points;
}

function renderProgressChart(exerciseName){
  const wrap = document.getElementById('progress-chart-wrap');
  const points = getBestSetPerArchiveForExercise(currentProfile, exerciseName);

  if(points.length === 0){
    wrap.innerHTML = `
      <div class="progress-chart-card">
        <div class="progress-chart-title">${exerciseName}</div>
        <div class="progress-chart-empty">Pas de poids enregistré pour cet exercice dans les archives.</div>
      </div>
    `;
    return;
  }

  const width = 320, height = 160, padding = 28;
  const maxW = Math.max(...points.map(p => p.weight));
  const minW = Math.min(...points.map(p => p.weight));
  const range = (maxW - minW) || 1;

  const stepX = points.length > 1 ? (width - padding * 2) / (points.length - 1) : 0;
  const coords = points.map((p, i) => {
    const x = padding + i * stepX;
    const y = height - padding - ((p.weight - minW) / range) * (height - padding * 2);
    return { x, y, ...p };
  });

  const linePath = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');

  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="var(--accent)"/>`).join('');
  const valueLabels = coords.map(c => `<text class="progress-value-label" x="${c.x.toFixed(1)}" y="${(c.y - 10).toFixed(1)}" text-anchor="middle">${c.weight}</text>`).join('');
  const dateLabels = coords.map(c => `<text class="progress-point-label" x="${c.x.toFixed(1)}" y="${height - 8}" text-anchor="middle">${c.dateLabel.slice(0,5)}</text>`).join('');

  wrap.innerHTML = `
    <div class="progress-chart-card">
      <div class="progress-chart-title">${exerciseName} — meilleure série (kg)</div>
      <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
        <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
        ${valueLabels}
        ${dateLabels}
      </svg>
    </div>
  `;
}

/* ---------- BUILD TRAINING (création / édition de séance personnalisée) ---------- */
let builderDraft = { name: '', cardio: false, exercises: [] };
let editingSessionId = null;

function blankBuilderExercise(){
  return { name:'', sets:3, repsCorentin:'', repsLisa:'', isCircuit:false, hasEquipmentOptions:false };
}

function resetBuilderDraft(){
  editingSessionId = null;
  builderDraft = {
    name: '',
    cardio: false,
    exercises: [ blankBuilderExercise() ]
  };
}

function loadBuilderDraftFromSession(session){
  editingSessionId = session.id;
  builderDraft = {
    name: session.label || '',
    cardio: !!session.cardio,
    exercises: (session.exercises || []).map(ex => ({
      name: ex.name || '',
      sets: ex.sets || 3,
      repsCorentin: (ex.target && ex.target.corentin) || '',
      repsLisa: (ex.target && ex.target.lisa) || '',
      isCircuit: ex.logType === 'circuit',
      hasEquipmentOptions: !!ex.equipmentOptions
    }))
  };
  if(builderDraft.exercises.length === 0) builderDraft.exercises.push(blankBuilderExercise());
}

function editCustomSession(id){
  const session = (window.customSessionsCache || []).find(s => s.id === id);
  if(!session) return;
  loadBuilderDraftFromSession(session);
  renderBuilderForm();
  showView('view-builder', 'fwd');
}

function renderBuilderForm(){
  const titleEl = document.getElementById('builder-title');
  if(titleEl) titleEl.textContent = editingSessionId ? 'Modifier la séance' : 'Créer une séance';
  const saveBtn = document.getElementById('builder-save-btn');
  if(saveBtn) saveBtn.textContent = editingSessionId ? 'Enregistrer les modifications ✅' : 'Enregistrer la séance ✅';

  document.getElementById('builder-name').value = builderDraft.name;
  document.getElementById('builder-cardio').checked = builderDraft.cardio;

  const container = document.getElementById('builder-exercises');
  container.innerHTML = '';

  builderDraft.exercises.forEach((ex, idx) => {
    const card = document.createElement('div');
    card.className = 'builder-exercise-card';

    const head = document.createElement('div');
    head.className = 'builder-exercise-head';
    head.innerHTML = `<span class="builder-exercise-num">Exercice ${idx + 1}</span>`;

    const headActions = document.createElement('div');
    headActions.className = 'builder-head-actions';

    const upBtn = document.createElement('button');
    upBtn.className = 'builder-move-btn';
    upBtn.textContent = '▲';
    upBtn.disabled = idx === 0;
    upBtn.onclick = () => moveBuilderExercise(idx, -1);
    headActions.appendChild(upBtn);

    const downBtn = document.createElement('button');
    downBtn.className = 'builder-move-btn';
    downBtn.textContent = '▼';
    downBtn.disabled = idx === builderDraft.exercises.length - 1;
    downBtn.onclick = () => moveBuilderExercise(idx, 1);
    headActions.appendChild(downBtn);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'builder-remove-btn';
    removeBtn.textContent = '✕';
    removeBtn.onclick = () => removeBuilderExercise(idx);
    headActions.appendChild(removeBtn);

    head.appendChild(headActions);
    card.appendChild(head);

    const nameRow = document.createElement('div');
    nameRow.className = 'builder-exercise-row';
    nameRow.innerHTML = `<span class="mini-label">Nom de l'exercice</span>`;
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'ex: Curl biceps (Haltères)';
    nameInput.value = ex.name;
    nameInput.oninput = () => { builderDraft.exercises[idx].name = nameInput.value; };
    nameRow.appendChild(nameInput);
    card.appendChild(nameRow);

    const setsRow = document.createElement('div');
    setsRow.className = 'builder-exercise-row';
    setsRow.innerHTML = `<span class="mini-label">Nombre de séries${ex.isCircuit ? ' (tours)' : ''}</span>`;
    const setsInput = document.createElement('input');
    setsInput.type = 'number';
    setsInput.inputMode = 'numeric';
    setsInput.placeholder = '3';
    setsInput.value = ex.sets;
    setsInput.oninput = () => { builderDraft.exercises[idx].sets = setsInput.value; };
    setsRow.appendChild(setsInput);
    card.appendChild(setsRow);

    const repsRow = document.createElement('div');
    repsRow.className = 'builder-reps-row';

    const repsCorentinRow = document.createElement('div');
    repsCorentinRow.className = 'builder-exercise-row';
    repsCorentinRow.innerHTML = `<span class="mini-label">${ex.isCircuit ? 'Cible Corentin' : 'Reps Corentin'}</span>`;
    const repsCorentinInput = document.createElement('input');
    repsCorentinInput.type = 'text';
    repsCorentinInput.placeholder = ex.isCircuit ? 'ex: 3 tours' : 'ex: 8-10 reps';
    repsCorentinInput.value = ex.repsCorentin;
    repsCorentinInput.oninput = () => { builderDraft.exercises[idx].repsCorentin = repsCorentinInput.value; };
    repsCorentinRow.appendChild(repsCorentinInput);
    repsRow.appendChild(repsCorentinRow);

    const repsLisaRow = document.createElement('div');
    repsLisaRow.className = 'builder-exercise-row';
    repsLisaRow.innerHTML = `<span class="mini-label">${ex.isCircuit ? 'Cible Lisa' : 'Reps Lisa'}</span>`;
    const repsLisaInput = document.createElement('input');
    repsLisaInput.type = 'text';
    repsLisaInput.placeholder = ex.isCircuit ? 'ex: 3 tours' : 'ex: 10-12 reps';
    repsLisaInput.value = ex.repsLisa;
    repsLisaInput.oninput = () => { builderDraft.exercises[idx].repsLisa = repsLisaInput.value; };
    repsLisaRow.appendChild(repsLisaInput);
    repsRow.appendChild(repsLisaRow);

    card.appendChild(repsRow);

    const optionsRow = document.createElement('div');
    optionsRow.className = 'builder-options-row';

    const circuitLabel = document.createElement('label');
    circuitLabel.className = 'builder-checkbox-label';
    const circuitCheckbox = document.createElement('input');
    circuitCheckbox.type = 'checkbox';
    circuitCheckbox.checked = ex.isCircuit;
    circuitCheckbox.onchange = () => {
      builderDraft.exercises[idx].isCircuit = circuitCheckbox.checked;
      renderBuilderForm();
    };
    circuitLabel.appendChild(circuitCheckbox);
    circuitLabel.appendChild(document.createTextNode(' Exercice type circuit (sans poids)'));
    optionsRow.appendChild(circuitLabel);

    const equipLabel = document.createElement('label');
    equipLabel.className = 'builder-checkbox-label';
    const equipCheckbox = document.createElement('input');
    equipCheckbox.type = 'checkbox';
    equipCheckbox.checked = ex.hasEquipmentOptions;
    equipCheckbox.onchange = () => { builderDraft.exercises[idx].hasEquipmentOptions = equipCheckbox.checked; };
    equipLabel.appendChild(equipCheckbox);
    equipLabel.appendChild(document.createTextNode(' Proposer variante Haltères / Poulie'));
    optionsRow.appendChild(equipLabel);

    card.appendChild(optionsRow);
    container.appendChild(card);
  });
}

function moveBuilderExercise(idx, delta){
  const newIdx = idx + delta;
  if(newIdx < 0 || newIdx >= builderDraft.exercises.length) return;
  const tmp = builderDraft.exercises[idx];
  builderDraft.exercises[idx] = builderDraft.exercises[newIdx];
  builderDraft.exercises[newIdx] = tmp;
  renderBuilderForm();
}

function addBuilderExercise(){
  builderDraft.name = document.getElementById('builder-name').value;
  builderDraft.cardio = document.getElementById('builder-cardio').checked;
  builderDraft.exercises.push(blankBuilderExercise());
  renderBuilderForm();
}
function removeBuilderExercise(idx){
  builderDraft.name = document.getElementById('builder-name').value;
  builderDraft.cardio = document.getElementById('builder-cardio').checked;
  builderDraft.exercises.splice(idx, 1);
  if(builderDraft.exercises.length === 0){
    builderDraft.exercises.push(blankBuilderExercise());
  }
  renderBuilderForm();
}

function saveCustomSession(){
  if(!window.__fb){
    showToast('Connexion au cloud en cours, réessaie dans un instant');
    return;
  }

  const name = document.getElementById('builder-name').value.trim();
  const cardioEnabled = document.getElementById('builder-cardio').checked;

  if(name === ''){
    showToast('Donne un nom à ta séance');
    return;
  }

  const validExercises = builderDraft.exercises
    .filter(ex => ex.name && ex.name.trim() !== '')
    .map(ex => {
      const built = {
        name: ex.name.trim(),
        sets: parseInt(ex.sets, 10) > 0 ? parseInt(ex.sets, 10) : 3,
        target: {
          corentin: ex.repsCorentin && ex.repsCorentin.trim() !== '' ? ex.repsCorentin.trim() : '—',
          lisa: ex.repsLisa && ex.repsLisa.trim() !== '' ? ex.repsLisa.trim() : '—'
        }
      };
      if(ex.isCircuit) built.logType = 'circuit';
      if(ex.hasEquipmentOptions) built.equipmentOptions = UPPER_BODY_OPTIONS;
      return built;
    });

  if(validExercises.length === 0){
    showToast('Ajoute au moins un exercice avec un nom');
    return;
  }

  const existing = editingSessionId ? (window.customSessionsCache || []).find(s => s.id === editingSessionId) : null;
  const session = {
    id: editingSessionId || ('custom_' + Date.now()),
    label: name,
    title: 'Séance personnalisée',
    createdAt: existing ? existing.createdAt : Date.now(),
    exercises: validExercises,
    cardio: cardioEnabled ? { name: 'Tapis incliné Zone 2', targetMinutes: 30 } : null
  };

  const { db, doc, setDoc } = window.__fb;
  setDoc(doc(db, 'customSessions', session.id), session)
    .then(() => {
      showToast(editingSessionId ? 'Séance mise à jour ✅' : 'Séance créée ✅');
      goToProfileView();
    })
    .catch((err) => {
      console.error('Erreur création séance Firestore', err);
      showToast(firestoreErrorMessage(err, "de la création"));
    });
}

function askDeleteCustomSession(id){
  showConfirm('Supprimer définitivement cette séance personnalisée (pour Corentin et Lisa) ?', () => deleteCustomSession(id));
}
function deleteCustomSession(id){
  if(!window.__fb){
    showToast('Connexion au cloud en cours, réessaie dans un instant');
    return;
  }
  const { db, doc, deleteDoc } = window.__fb;
  deleteDoc(doc(db, 'customSessions', id))
    .then(() => {
      showToast('Séance personnalisée supprimée');
    })
    .catch((err) => {
      console.error('Erreur suppression séance Firestore', err);
      showToast(firestoreErrorMessage(err, "de la suppression"));
    });
}

/* ---------- TOAST ---------- */
let toastTimer;
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ---------- AJUSTEMENT DYNAMIQUE DE L'ESPACE SOUS LE CONTENU (fix iPhone) ---------- */
function adjustBottomSpacing(){
  try{
    const bar = document.getElementById('bottom-bar');
    if(bar){
      const h = bar.offsetHeight;
      const computed = h + 24;
      // ne jamais descendre sous le minimum de sécurité défini en CSS (120px + safe-area)
      document.body.style.paddingBottom = Math.max(computed, 120) + 'px';
    }
  }catch(e){ /* ignore, le CSS statique sert de filet de sécurité */ }
}
window.addEventListener('resize', adjustBottomSpacing);
window.addEventListener('orientationchange', () => setTimeout(adjustBottomSpacing, 200));
window.addEventListener('load', adjustBottomSpacing);

/* ---------- INIT ---------- */
render();
adjustBottomSpacing();
setTimeout(adjustBottomSpacing, 300); // sécurité si les polices/safe-area se stabilisent après le premier rendu
</script>
