name: Generate Football Predictions

on:
  schedule:
    - cron: '0 6 * * *'        # 6h UTC tous les jours (avant les matchs du soir)
  push:
    branches: [main]
    paths: ['scripts/generate_predictions.py']
  workflow_dispatch:             # déclenchement manuel depuis GitHub UI

permissions:
  contents: write               # pour git push du data/predictions.json

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate predictions
        env:
          # Ajouter la clé dans Settings → Secrets → Actions → New secret
          # Nom : API_FOOTBALL_KEY  |  Valeur : ta clé x-apisports-key
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/generate_predictions.py

      - name: Commit & push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/predictions.json
          git diff --staged --quiet && echo "Aucun changement" && exit 0
          git commit -m "🤖 Pronostics $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
